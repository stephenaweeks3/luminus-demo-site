name: Refresh Salesforce access token on Render

on:
  schedule:
    # Every 23 hours — keeps the token fresh before Salesforce's 24-hour expiry
    - cron: '17 */23 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Install cryptography
        run: pip install cryptography

      - name: Get new Salesforce access token and push to Render
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          python3 - <<'PYEOF'
          import os, time, json, urllib.request, urllib.parse, urllib.error, base64
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          CLIENT_ID  = os.environ['SF_CLIENT_ID']
          USERNAME   = os.environ['SF_USERNAME']
          INSTANCE   = os.environ['SF_INSTANCE_URL'].rstrip('/')
          PEM        = os.environ['SF_PRIVATE_KEY'].replace('\\n', '\n')

          private_key = serialization.load_pem_private_key(PEM.encode(), password=None)

          now     = int(time.time())
          header  = base64.urlsafe_b64encode(json.dumps({'alg':'RS256','typ':'JWT'}).encode()).rstrip(b'=').decode()
          payload = base64.urlsafe_b64encode(json.dumps({
              'iss': CLIENT_ID, 'sub': USERNAME,
              'aud': INSTANCE + '/services/oauth2/token',
              'exp': now + 300,
          }).encode()).rstrip(b'=').decode()
          sig_input = f'{header}.{payload}'.encode()
          sig = private_key.sign(sig_input, padding.PKCS1v15(), hashes.SHA256())
          jwt_token = f'{header}.{payload}.{base64.urlsafe_b64encode(sig).rstrip(b"=").decode()}'

          data = urllib.parse.urlencode({
              'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              'assertion':  jwt_token,
          }).encode()
          req = urllib.request.Request(INSTANCE + '/services/oauth2/token', data=data, method='POST')
          with urllib.request.urlopen(req) as r:
              sf_resp = json.load(r)

          if 'access_token' not in sf_resp:
              raise RuntimeError(f'Salesforce token failed: {sf_resp}')

          access_token = sf_resp['access_token']
          print(f'Got Salesforce token: {access_token[:20]}...')

          # Update SF_ACCESS_TOKEN on the Render service.
          # Render's PUT /env-vars replaces ALL env vars, so we must GET first and merge.
          render_api_key    = os.environ['RENDER_API_KEY']
          render_service_id = os.environ['RENDER_SERVICE_ID']

          headers = {
              'Authorization': f'Bearer {render_api_key}',
              'Content-Type':  'application/json',
              'Accept':        'application/json',
          }

          # GET current env vars
          get_req = urllib.request.Request(
              f'https://api.render.com/v1/services/{render_service_id}/env-vars',
              headers=headers,
          )
          with urllib.request.urlopen(get_req) as r2:
              current = json.load(r2)  # list of {envVar: {key, value}}

          # Merge: update SF_ACCESS_TOKEN, keep everything else
          env_vars = {item['envVar']['key']: item['envVar']['value'] for item in current}
          env_vars['SF_ACCESS_TOKEN'] = access_token
          merged = [{'key': k, 'value': v} for k, v in env_vars.items()]

          put_req = urllib.request.Request(
              f'https://api.render.com/v1/services/{render_service_id}/env-vars',
              data=json.dumps(merged).encode(),
              method='PUT',
              headers=headers,
          )
          with urllib.request.urlopen(put_req) as r3:
              render_resp = r3.read().decode()
          print('Render env-vars updated. Render will redeploy automatically.')
          print(f'Token prefix: {access_token[:20]}...')
          PYEOF
